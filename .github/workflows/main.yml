name: WheyRank Scraper
on:
  schedule:
    - cron: "0 11-21 * * *"
    - cron: "0 23,1,3,5,7,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: wheyrank-scraper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Atualizar preços (página do link de afiliado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scraper.mjs
      - name: Gerar páginas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node gerar.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "chore: atualiza páginas com preços de hoje"
          git pull --rebase -q origin main
          git push
